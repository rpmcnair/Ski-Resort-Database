<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ski Database</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="header">
        <h1>Welcome to the Ski Database</h1>
    </div>
    <div class="toolbar">
        <button id="addButton">Add New Information</button>
        <button id="removeButton">Remove Information</button>
        <button id="updateButton">Update Information</button>
        <button id="searchButton">Search Records</button>
        <button id="chooseButton">Choose Details to View</button>
        <button id="combineButton">Combine Information</button>
        <button id="summaryButton">Summary Reports</button>
        <button id="advSummaryButton">Advanced Summary</button>
        <button id="comprehensiveButton">Find Comprehensive Records</button>
    </div>
    <div id="formSection">
        <!-- Form will be dynamically inserted here -->
    </div>
    <div id="resultsSection">
        <table id="resultsTable">
            <thead>
                <tr>
                    <!-- Table headers will be dynamically inserted here -->
                </tr>
            </thead>
            <tbody>
                <!-- Table rows will be dynamically inserted here -->
            </tbody>
        </table>
    </div>
    <script src="scripts.js"></script>
</body>
</html>
